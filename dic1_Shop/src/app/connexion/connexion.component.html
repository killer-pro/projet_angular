<!-- login.component.html -->
<div class="header_bottom">
    <div class="center">
        <span><img src="assets/image/home.svg" alt=""></span>
        <span> <a routerLink="/">acceuil</a></span>
        <span>></span>
        <span class="page">connexion</span>
    </div>  
</div>

<div class="corps connexion">
    <div class="log">
        <div class="head">
            <div class="active">Connexion</div>
            <div><a routerLink="/inscription">Inscription</a></div>
        </div>
        <div class="form">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <label for="email">Email</label>
                <input formControlName="email" id="email" type="email" />
                <div *ngIf="loginForm.get('email').invalid && loginForm.get('email').touched">
                    <small *ngIf="loginForm.get('email').hasError('required')">Email is required</small>
                    <small *ngIf="loginForm.get('email').hasError('email')">Invalid email format</small>
                </div>

                <label for="password">Password</label>
                <input formControlName="password" id="password" type="password" />
                <div *ngIf="loginForm.get('password').invalid && loginForm.get('password').touched">
                    <small *ngIf="loginForm.get('password').hasError('required')">Password is required</small>
                </div>

                <div *ngIf="error">
                    <small>{{ error }}</small>
                </div>

                <button class="valider" type="submit" [disabled]="loginForm.invalid">Suivant</button>
            </form>
        </div>
    </div>
</div>
